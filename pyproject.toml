[project]
name = "gridsentry"
version = "1.0.0"
description = "GridSentry — smart-meter network monitoring: theft, fault and tamper detection on live telemetry"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.7",
  "httpx>=0.27",
]
[project.optional-dependencies]
dev = ["pytest>=8.0"]
[tool.setuptools.packages.find]
include = ["app*"]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
